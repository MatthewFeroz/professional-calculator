[pytest]
# Make the project root importable so tests can `import app` / run main.py.
pythonpath = .
# Only look for tests in the tests/ directory.
testpaths = tests
# Always measure coverage of the application code and the entry point, show
# which lines are missing, and FAIL the run if total coverage is below 100%.
addopts = --cov=app --cov=main --cov-report=term-missing --cov-fail-under=100
