[pytest]
# Make the project root importable so tests can `import app` / run main.py.
pythonpath = .
# Only look for tests in the tests/ directory.
testpaths = tests
# Always measure coverage of the application code and the entry point —
# including branch coverage, so both outcomes of every condition must be
# tested — show what is missing, and FAIL the run if below 100%.
addopts = --cov=app --cov=main --cov-branch --cov-report=term-missing --cov-fail-under=100
